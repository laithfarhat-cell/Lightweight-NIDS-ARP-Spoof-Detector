services:
  nids:
    build: .
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    command: ["--interface", "${NIDS_INTERFACE:-eth0}", "--log-file", "/data/alerts.json"]
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 30s
